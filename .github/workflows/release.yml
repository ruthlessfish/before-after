name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json ships a tarball whose version
      # is not the one anyone tagged. Fail before anything is published.
      - name: Check the tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${pkg}" >&2
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm test

      # npm pack runs prepack, so this builds dist/ and packs exactly what a
      # publish would ship — types included.
      - name: Pack
        run: npm pack

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/before-after.es.js \
            dist/types/main.d.ts \
            dist/types/template.d.ts \
            "before-after-${GITHUB_REF_NAME}.tgz"
